version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alphaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphaforge
      POSTGRES_PASSWORD: alphaforge_secret
      POSTGRES_DB: alphaforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaforge -d alphaforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alphaforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphaforge-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://alphaforge:alphaforge_secret@postgres:5432/alphaforge_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - EXECUTION_MODE=PAPER
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphaforge-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
